[package]
name = "hbc-rs"
version = "0.1.0"
edition = "2024"
publish = false

[features]
startup-diagnostics = []
recovery-validation = ["startup-diagnostics"]
recovery-scan-validation = ["startup-diagnostics"]
# Diagnostic A/B switch: preserve Reborn code while displaying the prior HOME menu.
legacy-main-menu = []
debugger = ["debugger-usb-gecko"]
debugger-usb-gecko = ["dep:libdb-sys"]
debugger-network = ["dep:libdb-sys", "libdb-sys/wii-network"]

[dependencies]
ogc-report-protocol = { path = "../libogc-rs/crates/core/ogc-report-protocol" }
crc32fast = { version = "1.5.0", default-features = false }
fontdue = { version = "0.9.4", default-features = false, features = ["hashbrown"] }
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
libm = { version = "0.2", default-features = false }
ogc-alloc = { path = "../libogc-rs/crates/core/ogc-alloc" }
ogc-controller = { path = "../libogc-rs/crates/services/ogc-controller" }
ogc-ui = { path = "../libogc-rs/crates/services/ogc-ui" }

[dev-dependencies]
gdb-transport = { path = "../libogc-rs/crates/compatibility/gdb-transport" }

[target.'cfg(target_arch = "powerpc")'.dependencies]
ogc-core = { path = "../libogc-rs/crates/core/ogc-core" }
ogc-cache = { path = "../libogc-rs/crates/core/ogc-cache" }
ogc-conf = { path = "../libogc-rs/crates/core/ogc-conf" }
ogc-di = { path = "../libogc-rs/crates/services/ogc-di" }
ogc-fat = { path = "../libogc-rs/crates/services/ogc-fat" }
ogc-filesystem = { path = "../libogc-rs/crates/services/ogc-filesystem" }
ogc-es-sys = { path = "../libogc-rs/crates/core/ogc-es-sys" }
ogc-gx = { path = "../libogc-rs/crates/hardware/ogc-gx" }
ogc-input = { path = "../libogc-rs/crates/services/ogc-input" }
ogc-ios = { path = "../libogc-rs/crates/core/ogc-ios" }
ogc-ipc = { path = "../libogc-rs/crates/core/ogc-ipc" }
ogc-lwp = { path = "../libogc-rs/crates/core/ogc-lwp" }
ogc-irq = { path = "../libogc-rs/crates/core/ogc-irq" }
ogc-bt-sync = { path = "../libogc-rs/crates/services/ogc-bt-sync" }
ogc-network = { path = "../libogc-rs/crates/services/ogc-network" }
ogc-system = { path = "../libogc-rs/crates/core/ogc-system" }
ogc-video = { path = "../libogc-rs/crates/hardware/ogc-video" }
ogc-wd = { path = "../libogc-rs/crates/services/ogc-wd" }
ogc-usbgecko = { path = "../libogc-rs/crates/services/ogc-usbgecko" }
libdb-sys = { path = "../libogc-rs/crates/compatibility/libdb-sys", optional = true }
ogc-usbstorage-sys = { path = "../libogc-rs/crates/services/ogc-usbstorage-sys" }
ogc-wiilaunch = { path = "../libogc-rs/crates/core/ogc-wiilaunch" }
wpad-sys = { path = "../libogc-rs/crates/services/wpad-sys" }
